name: Export Bun dependencies
description: Build and upload the portable plugin dependency stores

runs:
  using: composite
  steps:
    - name: Export Bun dependency caches
      shell: bash
      run: |
        set -o errexit -o nounset -o pipefail
        # Realize both stores together so Nix can schedule them in parallel
        nix build --no-link --print-out-paths \
          .#equicord.bunDeps .#vencord.bunDeps > "$RUNNER_TEMP/bun-deps.paths"
        mapfile -t paths < "$RUNNER_TEMP/bun-deps.paths"
        if [[ ${#paths[@]} -ne 2 ]]; then
          echo "::error::Expected exactly two plugin dependency stores"
          exit 1
        fi
        # Compress once on Linux instead of transferring a raw NAR to every job
        nix-store --export "${paths[@]}" | zstd -T2 -3 -o "$RUNNER_TEMP/bun-deps.nar.zst"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ runner.temp }}/bun-deps.nar.zst
        archive: false
        if-no-files-found: error
        retention-days: 1
