name: Import pnpm dependencies
description: Download and import the plugin dependency stores from this run

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: pnpm-deps
        path: ${{ runner.temp }}/nixcord-pnpm-deps

    - name: Import pnpm dependency stores
      shell: bash
      run: nix-store --import < "$RUNNER_TEMP/nixcord-pnpm-deps/pnpm-deps.nar"
