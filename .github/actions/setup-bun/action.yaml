name: Set up Bun
description: Install the pinned Bun version and restore workspace dependencies

inputs:
  working-directory:
    description: Directory containing the package manifest and Bun lockfile
    required: false
    default: "."

  install-dependencies:
    description: Whether to install workspace dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.working-directory }}/package.json

    - name: Install workspace dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile --ignore-scripts
