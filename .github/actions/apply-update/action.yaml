name: Apply source update
description: Apply the prepared patch to the checkout and index for Nix

inputs:
  kind:
    description: Update type (discord or plugins)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.kind }}-source-update
        path: ${{ runner.temp }}/source-update

    - shell: bash
      run: git apply --allow-empty --index "$RUNNER_TEMP/source-update/changes.patch"
