name: Install Nix
description: Install Nix consistently across the repository workflows

inputs:
  extra-conf:
    description: Additional nix.conf settings required by the job
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: ${{ inputs.extra-conf }}
        github-token: ${{ github.token }}

    # Use GitHub's branch-scoped binary cache, not a separate FlakeHub service
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-gha-cache: enabled
        use-flakehub: disabled
        diagnostic-endpoint: ""
