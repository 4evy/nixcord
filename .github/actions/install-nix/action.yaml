name: Install Nix
description: Install Nix consistently across the repository workflows

inputs:
  extra-conf:
    description: Additional nix.conf settings required by the job
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: ${{ inputs.extra-conf }}
        github-token: ${{ github.token }}
