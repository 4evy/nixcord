name: Update Discord

on:
  workflow_call:

permissions: {}

# Build artifacts cross jobs; mutable Actions caches do not.
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  update-discord:
    name: Update and verify Discord
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      base-sha: ${{ steps.prepare-update.outputs.base-sha }}
      changed: ${{ steps.sources.outputs.changed }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - name: Check Discord manifests and update sources
        id: sources
        run: |
          set -o errexit -o nounset -o pipefail
          nix run .#update-discord
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = "pkgs/discord/sources/sources.json"
          previous = json.loads(subprocess.check_output(["git", "show", f"HEAD:{path}"]))
          current = json.loads(Path(path).read_text())
          tools_changed = subprocess.run([
              "git", "diff", "--quiet", "HEAD", "--", "pkgs/discord/patching/default.nix"
          ]).returncode != 0
          changed = previous != current or tools_changed
          packages = []
          for branch in ("stable", "ptb", "canary", "development"):
              key = f"linux-{branch}"
              if previous.get(key) != current.get(key) or tools_changed:
                  packages.append(".#discord" if branch == "stable" else f".#discord-{branch}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"changed={str(changed).lower()}", file=output)
              print(f"packages={' '.join(packages)}", file=output)
          if not changed:
              print("::notice::Discord manifests match pinned sources; skipping downloads and builds")
          PY

      - name: Validate sources
        run: |
          set -o errexit -o nounset -o pipefail
          jq --exit-status '
            def validHash:
              type == "string"
              and test("^sha256(-[A-Za-z0-9+/]{43}=|:[0-9a-fA-F]{64})$");
            def validSource:
              .kind == "distro"
              and (.version | type == "string" and length > 0)
              and (.distro.url | type == "string" and startswith("https://"))
              and (.distro.hash | validHash)
              and (.modules | type == "object" and length > 0)
              and all(.modules[];
                (.version | type == "number")
                and (.url | type == "string" and startswith("https://"))
                and (.hash | validHash)
              );
            ([keys[] | select(test("^(linux|osx)-(stable|ptb|canary|development)$"))] | length) == 8
            and all(.[]; validSource)
          ' pkgs/discord/sources/sources.json

      - name: Build changed Discord channels
        if: steps.sources.outputs.packages != ''
        env:
          DISCORD_PACKAGES: ${{ steps.sources.outputs.packages }}
        run: |
          set -o errexit -o nounset -o pipefail
          read -r -a packages <<< "$DISCORD_PACKAGES"
          nix build --no-link --print-build-logs "${packages[@]}"

      - name: Prepare verified source update
        id: prepare-update
        if: steps.sources.outputs.changed == 'true'
        run: |
          mkdir --parents source-update
          git diff --binary --full-index -- \
            pkgs/discord/sources/sources.json \
            pkgs/discord/patching/default.nix > source-update/changes.patch
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.sources.outputs.changed == 'true'
        with:
          name: discord-source-update
          path: source-update
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified Discord update
    needs: update-discord
    if: needs.update-discord.outputs.changed == 'true'
    permissions:
      actions: write # Dispatch validation for the bot commit.
      contents: write # Publish the verified update.
    uses: $/.github/workflows/publish-update.yaml
    with:
      kind: discord
      base-sha: ${{ needs.update-discord.outputs.base-sha }}
