name: Update Discord

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  NIXPKGS_EXPR: >-
    let flake = builtins.getFlake (toString ./.);
        pkgs = import flake.inputs.nixpkgs-nixcord {
          system = builtins.currentSystem;
          config.allowUnfree = true;
        };
    in

jobs:
  update-discord:
    name: Update and verify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      base-sha: ${{ steps.prepare-update.outputs.base-sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: ./.github/actions/install-nix

      - name: Update sources
        run: |
          set -euo pipefail
          test -f pkgs/discord/data/sources.json

          update_script=$(nix build --no-link --print-out-paths --impure --expr \
            "$NIXPKGS_EXPR (pkgs.callPackage ./pkgs/discord {}).passthru.updateScript")
          "$update_script/bin/discord-update"

      - name: Validate sources
        run: |
          set -euo pipefail
          jq -e '
            def validSource:
              .kind == "distro"
              and (.version | type == "string" and length > 0)
              and (.distro.url | type == "string" and startswith("https://"))
              and (.distro.hash | type == "string" and startswith("sha256-"))
              and (.modules | type == "object" and length > 0)
              and all(.modules[];
                (.version | type == "number")
                and (.url | type == "string" and startswith("https://"))
                and (.hash | type == "string" and startswith("sha256-"))
              );
            ([keys[] | select(test("^(linux|osx)-(stable|ptb|canary|development)$"))] | length) == 8
            and all(.[]; validSource)
          ' pkgs/discord/data/sources.json

      - name: Build all Discord channels
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs \
            .#discord \
            .#discord-ptb \
            .#discord-canary \
            .#discord-development

      - name: Prepare verified source update
        id: prepare-update
        run: |
          mkdir -p source-update
          git diff --binary --full-index -- pkgs/discord/data/sources.json > source-update/changes.patch
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-update
          path: source-update
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified Discord update
    needs: update-discord
    permissions:
      actions: write # Dispatch validation for the bot commit.
      contents: write # Publish the verified update.
    uses: ./.github/workflows/publish-update.yaml
    with:
      kind: discord
      base-sha: ${{ needs.update-discord.outputs.base-sha }}
