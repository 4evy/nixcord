name: Publish Verified Update

on:
  workflow_call:
    inputs:
      kind:
        description: Update type (plugins or discord)
        required: true
        type: string
      base-sha:
        description: Exact revision used for generation and validation
        required: true
        type: string
    outputs:
      commit-sha:
        description: SHA of the new commit, empty when no commit was published
        value: ${{ jobs.publish.outputs.commit-sha }}

permissions: {}

# Build artifacts cross jobs; mutable Actions caches do not.
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Commit and dispatch follow-up workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      commit-sha: ${{ steps.commit.outputs.commit-hash }}
    permissions:
      actions: write # GITHUB_TOKEN commits do not trigger push workflows.
      contents: write # Commit the verified files with GitHub signing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-sha }}
          persist-credentials: false

      - uses: $/.github/actions/apply-update
        with:
          kind: ${{ inputs.kind }}

      - name: Download verified GoofCord dependencies
        if: inputs.kind == 'plugins'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goofcord-update
          path: pkgs/goofcord

      - uses: $/.github/actions/setup-bun
        if: inputs.kind == 'plugins'
        with:
          install-dependencies: "false"

      - name: Describe update
        id: message
        env:
          UPDATE_KIND: ${{ inputs.kind }}
        run: |
          case "$UPDATE_KIND" in
            discord)
              paths=(pkgs/discord/sources/sources.json pkgs/discord/patching/default.nix)
              ;;
            plugins)
              paths=(
                pkgs/equicord/default.nix pkgs/equicord/bun.lock
                pkgs/vencord/default.nix pkgs/vencord/bun.lock
                pkgs/generate-options docs/site.nix pkgs/goofcord/default.nix
                pkgs/goofcord/bun.lock
                package.json bun.lock modules/plugins
              )
              ;;
            *) echo "::error::Unknown update kind"; exit 1 ;;
          esac
          message=$(python3 .github/scripts/update-message.py "$UPDATE_KIND" "${paths[@]}")
          delimiter=$(openssl rand -hex 16)
          {
            echo "files=${paths[*]}"
            echo "message<<$delimiter"
            jq --raw-output '.headline + "\n\n" + .body' <<< "$message"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # ghcommit uses local HEAD as expectedHeadOid: a moved branch fails instead
      # of rebasing generated files onto an unvalidated revision.
      - name: Commit verified update
        id: commit
        continue-on-error: true # Handle a moved branch by restarting validation below.
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          commit_message: ${{ steps.message.outputs.message }}
          file_pattern: ${{ steps.message.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restart update if the branch moved
        if: steps.commit.outcome == 'failure'
        uses: $/.github/actions/dispatch-if-updated
        with:
          branch: ${{ github.ref_name }}
          base-sha: ${{ inputs.base-sha }}
          workflows: update-plugins.yaml

      - name: Stop after failed publication
        if: steps.commit.outcome == 'failure'
        run: exit 1

      - name: Rebuild published documentation
        if: >-
          steps.commit.outcome == 'success' && steps.commit.outputs.commit-hash != '' &&
          inputs.kind == 'plugins' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run github-pages.yaml --ref "$REF_NAME"
