name: Update Plugins

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/actions/install-nix/**"
      - ".github/scripts/commit-changes.sh"
      - ".github/workflows/update-plugins.yaml"
      - "package.json"
      - "bun.lock"
      - "flake.lock"
      - "pkgs/generate-options.nix"
      - "pkgs/generate-options/**"
      - "pkgs/scripts/update-fixed-output-hash.sh"
      - "docs/site.nix"
  schedule:
    - cron: "0 */8 * * *" # Every 8 hours
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  NIXPKGS_EXPR: >-
    let flake = builtins.getFlake (toString ./.);
        pkgs = import flake.inputs.nixpkgs-nixcord {
          system = builtins.currentSystem;
          config.allowUnfree = true;
        };
    in

jobs:
  update-plugins:
    name: Update and verify plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base-sha: ${{ steps.prepare-update.outputs.base-sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: ./.github/actions/install-nix

      - name: Update Equicord and Vencord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for spec in "equicord.nix:equicord-update" "vencord.nix:vencord-update"; do
            package_file=${spec%%:*}
            update_bin=${spec#*:}
            update_script=$(nix build --no-link --print-out-paths --impure --expr \
              "$NIXPKGS_EXPR (pkgs.callPackage ./pkgs/$package_file {}).passthru.updateScript")
            "$update_script/bin/$update_bin"
          done

      - name: Refresh x86_64-linux dependencies and generate plugin options
        env:
          NIXCORD_GENERATE_WITH_GIT: "1"
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$system" != "x86_64-linux" ]]; then
            echo "::error::Expected x86_64-linux, got $system"
            exit 1
          fi
          node_modules_file=pkgs/generate-options/node-modules.nix
          hash_updater=pkgs/scripts/update-fixed-output-hash.sh
          "$hash_updater" refresh "$node_modules_file" "$system" -- bash -euo pipefail -c '
            nix build --no-link .#generate.node_modules
            nix build --rebuild --no-link .#generate.node_modules
          '
          nix run .#generate

          docs_file=docs/site.nix
          "$hash_updater" refresh "$docs_file" "$system" -- bash -euo pipefail -c '
            nix build --no-link .#docs.deps
            nix build --rebuild --no-link .#docs.deps
          '

      - name: Build packages and run checks
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs .#equicord .#vencord
          nix flake check --print-build-logs

      - name: Export pnpm dependency stores
        run: |
          set -euo pipefail
          paths=()
          for package in equicord vencord; do
            paths+=("$(nix build --no-link --print-out-paths --impure --expr \
              "$NIXPKGS_EXPR (pkgs.callPackage ./pkgs/$package.nix {}).pnpmDeps")")
          done
          nix-store --export "${paths[@]}" > pnpm-deps.nar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-deps
          path: pnpm-deps.nar
          compression-level: 0
          retention-days: 1

      - name: Prepare atomic plugin update
        id: prepare-update
        run: |
          set -euo pipefail
          paths=(
            pkgs/equicord.nix
            pkgs/vencord.nix
            pkgs/generate-options.nix
            pkgs/generate-options
            docs/site.nix
            package.json
            bun.lock
            modules/plugins
          )

          mkdir -p plugin-update
          git add --intent-to-add -- "${paths[@]}"
          git diff --binary --full-index -- "${paths[@]}" > plugin-update/changes.patch

          equicord_version=$(nix eval --raw .#equicord.version)
          vencord_version=$(nix eval --raw .#vencord.version)
          printf 'Equicord: %s\nVencord: %s\n' \
            "$equicord_version" "$vencord_version" > plugin-update/commit-body.txt
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ ! -s plugin-update/changes.patch ]]; then
            echo "::notice::Plugin sources and generated options are already current"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-update
          path: plugin-update
          retention-days: 1

  verify-platforms:
    name: Verify plugins on ${{ matrix.system }}
    needs: update-plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.update-plugins.outputs.base-sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-update
          path: plugin-update

      - name: Apply prepared plugin update
        run: |
          set -euo pipefail
          if [[ -s plugin-update/changes.patch ]]; then
            git apply --check plugin-update/changes.patch
            git apply plugin-update/changes.patch
          fi

      - uses: ./.github/actions/install-nix

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pnpm-deps
          path: .

      - name: Import pnpm dependency stores
        run: nix-store --import < pnpm-deps.nar

      - name: Refresh target dependencies
        env:
          EXPECTED_HOST_SYSTEM: ${{ matrix.system }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
          NIXCORD_GENERATE_WITH_GIT: "1"
        run: |
          set -euo pipefail
          actual_host_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_host_system" != "$EXPECTED_HOST_SYSTEM" ]]; then
            echo "::error::Expected host $EXPECTED_HOST_SYSTEM, got $actual_host_system"
            exit 1
          fi
          actual_system=$(nix --option system "$EXPECTED_SYSTEM" \
            eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_system" != "$EXPECTED_SYSTEM" ]]; then
            echo "::error::Expected target $EXPECTED_SYSTEM, got $actual_system"
            exit 1
          fi

          node_modules_file=pkgs/generate-options/node-modules.nix
          hash_updater=pkgs/scripts/update-fixed-output-hash.sh
          "$hash_updater" refresh "$node_modules_file" "$EXPECTED_SYSTEM" -- bash -euo pipefail -c "
            nix --option system '$EXPECTED_SYSTEM' build \
              --no-link .#generate.node_modules
            nix --option system '$EXPECTED_SYSTEM' build \
              --rebuild --no-link .#generate.node_modules
          "

          expected_plugins=$(mktemp -d)
          cp -R modules/plugins/. "$expected_plugins/"
          nix --option system "$EXPECTED_SYSTEM" run .#generate
          if ! diff -qr "$expected_plugins" modules/plugins; then
            echo "::error::Generated plugin metadata differs on $EXPECTED_SYSTEM"
            diff -ru "$expected_plugins" modules/plugins || true
            exit 1
          fi

          if nix --option system "$EXPECTED_SYSTEM" eval \
            --raw ".#packages.$EXPECTED_SYSTEM.docs.drvPath" >/dev/null 2>&1; then
            docs_file=docs/site.nix
            "$hash_updater" refresh "$docs_file" "$EXPECTED_SYSTEM" -- bash -euo pipefail -c "
              nix --option system '$EXPECTED_SYSTEM' build \
                --no-link .#docs.deps
              nix --option system '$EXPECTED_SYSTEM' build \
                --rebuild --no-link .#docs.deps
            "
          fi

      - name: Build packages and run checks
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          packages=(
            ".#packages.$EXPECTED_SYSTEM.equicord"
            ".#packages.$EXPECTED_SYSTEM.vencord"
          )
          if nix --option system "$EXPECTED_SYSTEM" eval \
            --raw ".#packages.$EXPECTED_SYSTEM.docs.drvPath" >/dev/null 2>&1; then
            packages+=(".#packages.$EXPECTED_SYSTEM.docs")
          fi
          nix_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nix_args+=(--max-jobs 1 --cores 2)
          fi
          nix --option system "$EXPECTED_SYSTEM" build \
            "${nix_args[@]}" --no-link --print-build-logs "${packages[@]}"
          nix --option system "$EXPECTED_SYSTEM" flake check \
            "${nix_args[@]}" --print-build-logs

      - name: Record dependency hashes
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          hash_updater=pkgs/scripts/update-fixed-output-hash.sh
          node_modules_hash=$("$hash_updater" get pkgs/generate-options/node-modules.nix "$EXPECTED_SYSTEM")

          mkdir -p dependency-hashes
          hashes_file="dependency-hashes/$EXPECTED_SYSTEM.txt"
          printf 'node_modules %s %s\n' "$EXPECTED_SYSTEM" "$node_modules_hash" > "$hashes_file"

          if nix --option system "$EXPECTED_SYSTEM" eval \
            --raw ".#packages.$EXPECTED_SYSTEM.docs.drvPath" >/dev/null 2>&1; then
            docs_hash=$("$hash_updater" get docs/site.nix "$EXPECTED_SYSTEM")
            printf 'docs %s %s\n' "$EXPECTED_SYSTEM" "$docs_hash" >> "$hashes_file"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-hashes-${{ matrix.system }}
          path: dependency-hashes
          retention-days: 1

  commit-plugin-update:
    name: Commit verified plugin update
    needs:
      - update-plugins
      - verify-platforms
    runs-on: ubuntu-24.04
    permissions:
      actions: write # Dispatch checks for the refreshed head commit.
      contents: write # Commit the fully verified update atomically.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.update-plugins.outputs.base-sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-update
          path: plugin-update

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dependency-hashes-*
          path: dependency-hashes
          merge-multiple: true

      - name: Assemble verified plugin update
        run: |
          set -euo pipefail
          if [[ -s plugin-update/changes.patch ]]; then
            git apply --check plugin-update/changes.patch
            git apply plugin-update/changes.patch
          fi

          shopt -s nullglob
          hash_files=(dependency-hashes/*.txt)
          if [[ "${#hash_files[@]}" -ne 2 ]]; then
            echo "::error::Expected 2 platform hash files, got ${#hash_files[@]}"
            exit 1
          fi

          hash_updater=pkgs/scripts/update-fixed-output-hash.sh
          for hashes_file in "${hash_files[@]}"; do
            while read -r kind system hash; do
              case "$kind" in
                node_modules)
                  target=pkgs/generate-options/node-modules.nix
                  ;;
                docs)
                  target=docs/site.nix
                  ;;
                *)
                  echo "::error::Unknown dependency hash kind: $kind"
                  exit 1
                  ;;
              esac
              "$hash_updater" set "$target" "$system" "$hash"
            done < "$hashes_file"
          done

      - name: Commit plugin update
        id: commit-update
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          paths=(
            pkgs/equicord.nix
            pkgs/vencord.nix
            pkgs/generate-options.nix
            pkgs/generate-options
            docs/site.nix
            package.json
            bun.lock
            modules/plugins
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "::notice::Plugin sources and dependency hashes are already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body=$(< plugin-update/commit-body.txt)
          bash .github/scripts/commit-changes.sh \
            "$REF_NAME" "plugins: update snapshots and dependency hashes" "$body" \
            "${paths[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check refreshed head commit
        if: steps.commit-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run check.yaml --ref "$REF_NAME"
