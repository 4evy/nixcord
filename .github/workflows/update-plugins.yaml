name: Update Discord and Plugins

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/actions/install-nix/**"
      - ".github/actions/export-bun-deps/**"
      - ".github/actions/import-bun-deps/**"
      - ".github/actions/upload-update/**"
      - ".github/actions/apply-update/**"
      - ".github/actions/dispatch-if-updated/**"
      - ".github/scripts/update-message.py"
      - ".github/workflows/update-plugins.yaml"
      - ".github/workflows/update-discord.yaml"
      - ".github/workflows/publish-update.yaml"
      - "bunfig.toml"
      - "package.json"
      - "bun.lock"
      - "packages/**"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/generate-options/**"
      - "pkgs/discord/**"
      - "pkgs/build-client-mod/**"
      - "pkgs/bun/**"
      - "pkgs/equicord/default.nix"
      - "pkgs/vencord/default.nix"
      - "pkgs/goofcord/**"
      - "modules/lib/normalization/**"
      - "modules/lib/packages/**"
      - "modules/plugins/overrides.json"
      - "nix/flake/apps.nix"
      - "nix/flake/default.nix"
      - "nix/generate-with-git.nix"
      - "nix/bun/**"
      - "docs/site.nix"
  schedule:
    - cron: "0 * * * *"
      timezone: "Etc/UTC"
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.ref_name }}
  cancel-in-progress: false
  # Keep pending updates from different workflows instead of replacing them
  queue: max

permissions: {}

# Immutable artifacts carry generated sources and dependencies between jobs
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  update-discord:
    name: Update Discord first
    cache-mode: write
    permissions:
      actions: write # Dispatch validation and retry if the branch moves
      contents: write # Publish verified Discord sources before updating plugins
    uses: $/.github/workflows/update-discord.yaml

  update-plugins:
    name: Generate plugin update
    needs: update-discord
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    cache-mode: write
    outputs:
      base-sha: ${{ steps.prepare-update.outputs.base-sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - name: Update Equicord and Vencord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          nix run .#update-plugins

      - name: Refresh shared Bun dependencies and generate plugin options
        env:
          GENERATE_WITH_GIT: "1"
        run: |
          set -o errexit -o nounset -o pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$system" != "x86_64-linux" ]]; then
            echo "::error::Expected x86_64-linux, got $system"
            exit 1
          fi
          nix run .#update -- generate
          nix run .#generate

      - uses: $/.github/actions/export-bun-deps

      - name: Prepare atomic plugin update
        id: prepare-update
        uses: $/.github/actions/upload-update
        with:
          kind: plugins
          paths: |-
            pkgs/equicord
            pkgs/vencord
            pkgs/generate-options
            docs/site.nix
            package.json
            bun.lock
            modules/plugins

  verify-platforms:
    name: Verify plugins on ${{ matrix.system }}
    needs: update-plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    cache-mode: write
    permissions:
      contents: read
    env:
      EXPECTED_SYSTEM: ${{ matrix.system }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-plugins.outputs.base-sha }}
          persist-credentials: false

      - uses: $/.github/actions/apply-update
        with:
          kind: plugins

      - uses: $/.github/actions/install-nix

      - uses: $/.github/actions/import-bun-deps

      - name: Verify native runner
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$system" != "$EXPECTED_SYSTEM" ]]; then
            echo "::error::Expected $EXPECTED_SYSTEM, got $system"
            exit 1
          fi

      # The update job already generated the reference metadata on x86_64-linux
      - name: Verify generated plugin metadata
        if: matrix.system != 'x86_64-linux'
        env:
          GENERATE_WITH_GIT: "1"
        run: |
          set -o errexit -o nounset -o pipefail
          expected_plugins=$(mktemp -d)
          cp -R modules/plugins/. "$expected_plugins/"
          nix run .#generate
          if ! diff --recursive --unified "$expected_plugins" modules/plugins; then
            echo "::error::Generated plugin metadata differs on $EXPECTED_SYSTEM"
            exit 1
          fi

      - name: Refresh GoofCord
        if: matrix.system == 'aarch64-darwin'
        run: nix run .#update-goofcord

      - name: Build packages and run checks
        run: |
          set -o errexit -o nounset -o pipefail
          packages=(.#equicord .#vencord)
          if [[ "$EXPECTED_SYSTEM" != "x86_64-linux" ]]; then
            packages+=(.#goofcord)
            has_docs=$(nix eval --json ".#packages.$EXPECTED_SYSTEM" \
              --apply 'packages: packages ? docs')
            if [[ "$has_docs" == true ]]; then
              packages+=(.#docs)
            fi
          fi
          nix_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nix_args+=(--max-jobs 1 --cores 2)
          fi
          nix build "${nix_args[@]}" --no-link --print-build-logs "${packages[@]}"
          nix flake check "${nix_args[@]}" --print-build-logs

      - name: Upload verified GoofCord dependencies
        if: matrix.system == 'aarch64-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goofcord-update
          path: |
            pkgs/goofcord/default.nix
            pkgs/goofcord/bun.lock
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified plugin update
    needs: [update-plugins, verify-platforms]
    permissions:
      actions: write # Dispatch validation and documentation for the bot commit.
      contents: write # Publish the verified update.
    uses: $/.github/workflows/publish-update.yaml
    with:
      kind: plugins
      base-sha: ${{ needs.update-plugins.outputs.base-sha }}

  check-updated-head:
    name: Check the final updated revision
    needs: [update-discord, update-plugins, verify-platforms, publish]
    # A Discord commit still needs checks if plugin verification fails or is cancelled
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write # Bot commits do not trigger push workflows
    steps:
      - name: Dispatch checks after all update stages finish
        uses: $/.github/actions/dispatch-if-updated
        with:
          branch: ${{ github.ref_name }}
          base-sha: ${{ github.sha }}
          workflows: check.yaml
