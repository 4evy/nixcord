name: Update Plugins

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/actions/install-nix/**"
      - ".github/scripts/update-message.py"
      - ".github/workflows/update-plugins.yaml"
      - ".github/workflows/publish-update.yaml"
      - "package.json"
      - "package-lock.json"
      - "flake.lock"
      - "pkgs/generate-options/**"
      - "pkgs/plugin-update.nix"
      - "pkgs/equicord/default.nix"
      - "pkgs/vencord/default.nix"
      - "pkgs/goofcord/**"
      - "modules/lib/core.nix"
      - "modules/plugins/overrides.json"
      - "nix/flake/apps.nix"
      - "docs/site.nix"
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  NIXPKGS_EXPR: >-
    let flake = builtins.getFlake (toString ./.);
        pkgs = import flake.inputs.nixpkgs-nixcord {
          system = builtins.currentSystem;
          config.allowUnfree = true;
        };
    in

jobs:
  update-plugins:
    name: Update and verify plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base-sha: ${{ steps.prepare-update.outputs.base-sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: ./.github/actions/install-nix

      - name: Update Equicord and Vencord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix run .#update-plugins

      - name: Refresh shared npm dependencies and generate plugin options
        env:
          NIXCORD_GENERATE_WITH_GIT: "1"
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$system" != "x86_64-linux" ]]; then
            echo "::error::Expected x86_64-linux, got $system"
            exit 1
          fi
          nix develop --command nix-update --flake --version=skip --no-src \
            --override-filename pkgs/generate-options/node-modules.nix generate.npmDeps
          nix run .#generate

      - name: Build packages and run checks
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs .#equicord .#vencord
          nix flake check --print-build-logs

      - name: Export pnpm dependency stores
        run: |
          set -euo pipefail
          paths=()
          for package in equicord vencord; do
            paths+=("$(nix build --no-link --print-out-paths --impure --expr \
              "$NIXPKGS_EXPR (pkgs.callPackage ./pkgs/$package {}).pnpmDeps")")
          done
          nix-store --export "${paths[@]}" > pnpm-deps.nar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-deps
          path: pnpm-deps.nar
          compression-level: 0
          retention-days: 1

      - name: Prepare atomic plugin update
        id: prepare-update
        run: |
          set -euo pipefail
          paths=(
            pkgs/equicord/default.nix
            pkgs/vencord/default.nix
            pkgs/generate-options
            docs/site.nix
            package.json
            package-lock.json
            modules/plugins
          )

          mkdir -p source-update
          git add --intent-to-add -- "${paths[@]}"
          git diff --no-ext-diff --no-textconv --no-color --binary --full-index \
            -- "${paths[@]}" > source-update/changes.patch

          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ ! -s source-update/changes.patch ]]; then
            echo "::notice::Plugin sources and generated options are already current"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-update
          path: source-update
          if-no-files-found: error
          retention-days: 1

  verify-platforms:
    name: Verify plugins on ${{ matrix.system }}
    needs: update-plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.update-plugins.outputs.base-sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-update
          path: source-update

      - name: Apply prepared plugin update
        run: |
          set -euo pipefail
          if [[ -s source-update/changes.patch ]]; then
            git apply source-update/changes.patch
          fi
          git add -- pkgs docs/site.nix package.json package-lock.json modules/plugins

      - uses: ./.github/actions/install-nix

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pnpm-deps
          path: .

      - name: Import pnpm dependency stores
        run: nix-store --import < pnpm-deps.nar

      - name: Verify generated metadata and refresh GoofCord
        env:
          EXPECTED_HOST_SYSTEM: ${{ matrix.system }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
          NIXCORD_GENERATE_WITH_GIT: "1"
        run: |
          set -euo pipefail
          actual_host_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_host_system" != "$EXPECTED_HOST_SYSTEM" ]]; then
            echo "::error::Expected host $EXPECTED_HOST_SYSTEM, got $actual_host_system"
            exit 1
          fi
          actual_system=$(nix --option system "$EXPECTED_SYSTEM" \
            eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_system" != "$EXPECTED_SYSTEM" ]]; then
            echo "::error::Expected target $EXPECTED_SYSTEM, got $actual_system"
            exit 1
          fi

          expected_plugins=$(mktemp -d)
          cp -R modules/plugins/. "$expected_plugins/"
          nix --option system "$EXPECTED_SYSTEM" run .#generate
          if ! diff -qr "$expected_plugins" modules/plugins; then
            echo "::error::Generated plugin metadata differs on $EXPECTED_SYSTEM"
            diff -ru "$expected_plugins" modules/plugins || true
            exit 1
          fi

          if [[ "$EXPECTED_SYSTEM" == "aarch64-darwin" ]]; then
            nix --option system "$EXPECTED_SYSTEM" run .#update-goofcord
          fi

      - name: Build packages and run checks
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          packages=(
            ".#packages.$EXPECTED_SYSTEM.equicord"
            ".#packages.$EXPECTED_SYSTEM.vencord"
            ".#packages.$EXPECTED_SYSTEM.goofcord"
          )
          if nix --option system "$EXPECTED_SYSTEM" eval \
            --raw ".#packages.$EXPECTED_SYSTEM.docs.drvPath" >/dev/null 2>&1; then
            packages+=(".#packages.$EXPECTED_SYSTEM.docs")
          fi
          nix_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nix_args+=(--max-jobs 1 --cores 2)
          fi
          nix --option system "$EXPECTED_SYSTEM" build \
            "${nix_args[@]}" --no-link --print-build-logs "${packages[@]}"
          nix --option system "$EXPECTED_SYSTEM" flake check \
            "${nix_args[@]}" --print-build-logs

      - name: Upload verified GoofCord dependencies
        if: matrix.system == 'aarch64-darwin'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goofcord-update
          path: |
            pkgs/goofcord/default.nix
            pkgs/goofcord/package-lock.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified plugin update
    needs: [update-plugins, verify-platforms]
    permissions:
      actions: write # Dispatch validation and documentation for the bot commit.
      contents: write # Publish the verified update.
    uses: ./.github/workflows/publish-update.yaml
    with:
      kind: plugins
      base-sha: ${{ needs.update-plugins.outputs.base-sha }}
