name: Update Discord and Plugins

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/actions/install-nix/**"
      - ".github/actions/export-bun-deps/**"
      - ".github/actions/import-bun-deps/**"
      - ".github/scripts/update-message.py"
      - ".github/workflows/update-plugins.yaml"
      - ".github/workflows/update-discord.yaml"
      - ".github/workflows/publish-update.yaml"
      - "bunfig.toml"
      - "package.json"
      - "bun.lock"
      - "packages/**"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/default.nix"
      - "pkgs/generate-options/**"
      - "pkgs/discord/**"
      - "pkgs/build-client-mod/**"
      - "pkgs/bun/**"
      - "pkgs/equicord/default.nix"
      - "pkgs/vencord/default.nix"
      - "pkgs/goofcord/**"
      - "modules/lib/normalization/**"
      - "modules/lib/packages/**"
      - "modules/plugins/overrides.json"
      - "nix/flake/apps.nix"
      - "nix/generate-with-git.nix"
      - "nix/bun/**"
      - "docs/site.nix"
  schedule:
    - cron: "0 * * * *"
      timezone: "Etc/UTC"
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.ref_name }}
  cancel-in-progress: false
  # Keep pending updates from different workflows instead of replacing them
  queue: max

permissions: {}

# Build artifacts cross jobs; mutable Actions caches do not.
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  update-discord:
    name: Update Discord first
    permissions:
      actions: write # Dispatch validation and retry if the branch moves
      contents: write # Publish verified Discord sources before updating plugins
    uses: $/.github/workflows/update-discord.yaml

  update-plugins:
    name: Update and verify plugins
    needs: update-discord
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      base-sha: ${{ steps.prepare-update.outputs.base-sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - name: Update Equicord and Vencord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          nix run .#update-plugins

      - name: Refresh shared Bun dependencies and generate plugin options
        env:
          GENERATE_WITH_GIT: "1"
        run: |
          set -o errexit -o nounset -o pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$system" != "x86_64-linux" ]]; then
            echo "::error::Expected x86_64-linux, got $system"
            exit 1
          fi
          nix run .#update -- generate
          nix run .#generate

      - name: Build packages and run checks
        run: |
          set -o errexit -o nounset -o pipefail
          nix build --no-link --print-build-logs .#equicord .#vencord
          nix flake check --print-build-logs

      - uses: $/.github/actions/export-bun-deps

      - name: Prepare atomic plugin update
        id: prepare-update
        run: |
          set -o errexit -o nounset -o pipefail
          paths=(
            pkgs/equicord
            pkgs/vencord
            pkgs/generate-options
            docs/site.nix
            package.json
            bun.lock
            modules/plugins
          )

          mkdir --parents source-update
          git add --intent-to-add -- "${paths[@]}"
          git diff --no-ext-diff --no-textconv --no-color --binary --full-index \
            -- "${paths[@]}" > source-update/changes.patch

          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ ! -s source-update/changes.patch ]]; then
            echo "::notice::Plugin sources and generated options are already current"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins-source-update
          path: source-update
          if-no-files-found: error
          retention-days: 1

  verify-platforms:
    name: Verify plugins on ${{ matrix.system }}
    needs: update-plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update-plugins.outputs.base-sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins-source-update
          path: source-update

      - name: Apply prepared plugin update
        run: |
          set -o errexit -o nounset -o pipefail
          if [[ -s source-update/changes.patch ]]; then
            git apply source-update/changes.patch
          fi
          git add -- pkgs docs/site.nix package.json bun.lock modules/plugins

      - uses: $/.github/actions/install-nix

      - uses: $/.github/actions/import-bun-deps

      - name: Verify generated metadata and refresh GoofCord
        env:
          EXPECTED_HOST_SYSTEM: ${{ matrix.system }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
          GENERATE_WITH_GIT: "1"
        run: |
          set -o errexit -o nounset -o pipefail
          actual_host_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_host_system" != "$EXPECTED_HOST_SYSTEM" ]]; then
            echo "::error::Expected host $EXPECTED_HOST_SYSTEM, got $actual_host_system"
            exit 1
          fi
          actual_system=$(nix --option system "$EXPECTED_SYSTEM" \
            eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_system" != "$EXPECTED_SYSTEM" ]]; then
            echo "::error::Expected target $EXPECTED_SYSTEM, got $actual_system"
            exit 1
          fi

          expected_plugins=$(mktemp -d)
          cp -R modules/plugins/. "$expected_plugins/"
          nix --option system "$EXPECTED_SYSTEM" run .#generate
          if ! diff --brief --recursive "$expected_plugins" modules/plugins; then
            echo "::error::Generated plugin metadata differs on $EXPECTED_SYSTEM"
            diff --recursive --unified "$expected_plugins" modules/plugins || true
            exit 1
          fi

          if [[ "$EXPECTED_SYSTEM" == "aarch64-darwin" ]]; then
            nix --option system "$EXPECTED_SYSTEM" run .#update-goofcord
          fi

      - name: Build packages and run checks
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -o errexit -o nounset -o pipefail
          packages=(
            ".#packages.$EXPECTED_SYSTEM.equicord"
            ".#packages.$EXPECTED_SYSTEM.vencord"
            ".#packages.$EXPECTED_SYSTEM.goofcord"
          )
          if nix --option system "$EXPECTED_SYSTEM" eval \
            --raw ".#packages.$EXPECTED_SYSTEM.docs.drvPath" >/dev/null 2>&1; then
            packages+=(".#packages.$EXPECTED_SYSTEM.docs")
          fi
          nix_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nix_args+=(--max-jobs 1 --cores 2)
          fi
          nix --option system "$EXPECTED_SYSTEM" build \
            "${nix_args[@]}" --no-link --print-build-logs "${packages[@]}"
          nix --option system "$EXPECTED_SYSTEM" flake check \
            "${nix_args[@]}" --print-build-logs

      - name: Upload verified GoofCord dependencies
        if: matrix.system == 'aarch64-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goofcord-update
          path: |
            pkgs/goofcord/default.nix
            pkgs/goofcord/bun.lock
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified plugin update
    needs: [update-plugins, verify-platforms]
    permissions:
      actions: write # Dispatch validation and documentation for the bot commit.
      contents: write # Publish the verified update.
    uses: $/.github/workflows/publish-update.yaml
    with:
      kind: plugins
      base-sha: ${{ needs.update-plugins.outputs.base-sha }}

  check-updated-head:
    name: Check the final updated revision
    needs: [update-discord, update-plugins, verify-platforms, publish]
    # A Discord commit still needs checks if plugin verification fails or is cancelled
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write # Bot commits do not trigger push workflows
    steps:
      - name: Dispatch checks after all update stages finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          START_SHA: ${{ github.sha }}
        run: |
          set -o errexit -o nounset -o pipefail
          ref=$(jq --raw-output --null-input --arg ref "$REF_NAME" '$ref | @uri')
          head=$(gh api "repos/$GH_REPO/git/ref/heads/$ref" --jq .object.sha)
          if [[ "$head" == "$START_SHA" ]]; then
            echo "::notice::No new revision to check"
            exit 0
          fi
          gh workflow run check.yaml --ref "$REF_NAME"
