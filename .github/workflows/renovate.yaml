name: Renovate

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays at 10:00 UTC
      timezone: "Etc/UTC"
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.event.repository.default_branch }}
  cancel-in-progress: false
  # Keep pending updates from different workflows instead of replacing them
  queue: max

permissions: {}

# Build artifacts cross jobs; mutable Actions caches do not.
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  renovate:
    name: Update dependencies directly
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    outputs:
      base-sha: ${{ steps.base.outputs.result }}
    permissions:
      contents: write # Push dependency update commits.
      pull-requests: read # Detect existing Renovate pull requests.
      statuses: write # Report Renovate commit status.
    steps:
      - name: Record default branch before Renovate
        id: base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const branch = context.payload.repository.default_branch
            const { data } = await github.rest.git.getRef({...context.repo, ref: `heads/${branch}`})
            return data.object.sha

      - name: Run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ github.token }}
          renovate-version: "44.261.2"
          renovate-image: >-
            ghcr.io/renovatebot/renovate@sha256:1022cef9c87acb3a6fb6c00dd112cbcac2c86a2928975bc8949b8d5e9aba56b1
        env:
          LOG_LEVEL: info
          RENOVATE_GIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'

  follow-up:
    name: Validate dependency updates
    needs: renovate
    # Renovate can push a commit before a later update fails
    if: ${{ !cancelled() && needs.renovate.outputs.base-sha != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write # GITHUB_TOKEN commits do not trigger push workflows
    steps:
      - name: Dispatch checks and refreshes if the default branch changed
        uses: $/.github/actions/dispatch-if-updated
        with:
          branch: ${{ github.event.repository.default_branch }}
          base-sha: ${{ needs.renovate.outputs.base-sha }}
          workflows: check.yaml update-plugins.yaml github-pages.yaml
