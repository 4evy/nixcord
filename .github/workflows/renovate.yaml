name: Renovate

on:
  schedule:
    - cron: "37 10 * * 1" # Mondays at 10:37 UTC
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Update dependencies directly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Push dependency update commits.
      pull-requests: read # Detect existing Renovate pull requests.
      statuses: write # Report Renovate commit status.
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ github.token }}
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: "44.93.5"
        env:
          LOG_LEVEL: info
          RENOVATE_GIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
