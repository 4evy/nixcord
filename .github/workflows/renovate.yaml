name: Renovate

on:
  schedule:
    - cron: "37 10 * * 1" # Mondays at 10:37 UTC
  workflow_dispatch:

concurrency:
  # Serialize every workflow that can push to the same branch.
  group: repository-updates-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Update dependencies directly
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push dependency update commits.
      pull-requests: read # Detect existing Renovate pull requests.
      statuses: write # Report Renovate commit status.
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          working-directory: .github/renovate

      # Branch automerge pushes successful updates straight to main without PRs.
      # Repeated passes let the single-branch queue drain during one workflow run.
      - name: Run Renovate
        run: |
          for pass in 1 2 3 4 5 6; do
            echo "Renovate pass ${pass}"
            node .github/renovate/node_modules/renovate/dist/renovate.js
          done
        env:
          LOG_LEVEL: info
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_GIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'

      - name: Synchronize npins with the updated flake lock
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh auth setup-git

          for attempt in {1..5}; do
            git fetch origin "$TARGET_REF"
            git switch --force-create npins-sync "origin/$TARGET_REF"
            ./nix/sync-npins.sh

            if git diff --quiet -- npins/sources.json; then
              echo "::notice::npins already matches the updated flake lock"
              exit 0
            fi

            if bash .github/scripts/commit-changes.sh \
              "$TARGET_REF" \
              "chore(deps): sync npins with flake lock" \
              "" \
              npins/sources.json; then
              exit 0
            fi

            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Failed to commit npins synchronization after 5 attempts"
              exit 1
            fi
            git restore --source=HEAD --staged --worktree -- npins/sources.json
          done
