name: Project Checks

on:
  merge_group:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  workflow-quality:
    name: Workflow and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - name: Lint and security-audit GitHub Actions
        run: nix develop .#ci --command bash .github/scripts/check-workflows.sh

  javascript:
    name: JavaScript and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-node

      - name: Check TypeScript, docs, dead code, duplication, and formatting
        run: npm run check

      - name: Run JavaScript and TypeScript tests
        run: npm run test

  nix-quality:
    name: Nix formatting and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - name: Test evaluation benchmark CLI
        run: bash nix/tests/benchmark-eval.sh

      - name: Verify non-flake source
        run: nix-instantiate --eval --strict --expr '(import ./npins).nixpkgs'

      - name: Check Nix formatting
        run: nix fmt -- --fail-on-change .

  renovate-config:
    name: Renovate configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-node
        with:
          working-directory: .github/renovate

      - name: Validate Renovate configuration
        run: >-
          node .github/renovate/node_modules/renovate/dist/config-validator.js
          --strict --no-global .github/renovate.json

  prepare-pnpm-deps:
    name: Prepare pnpm dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - name: Export pnpm dependency stores
        env:
          NIXPKGS_EXPR: >-
            let flake = builtins.getFlake (toString ./.);
                pkgs = import flake.inputs.nixpkgs-nixcord {
                  system = builtins.currentSystem;
                  config.allowUnfree = true;
                };
            in
        run: |
          set -euo pipefail
          # Realize both stores together so Nix can schedule them in parallel
          nix build --no-link --print-out-paths --impure --expr \
            "$NIXPKGS_EXPR"' map (path: (pkgs.callPackage path {}).pnpmDeps) [
              ./pkgs/equicord ./pkgs/vencord
            ]' > pnpm-deps.paths
          mapfile -t paths < pnpm-deps.paths
          nix-store --export "${paths[@]}" > pnpm-deps.nar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pnpm-deps
          path: pnpm-deps.nar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  nix:
    name: Nix
    needs: prepare-pnpm-deps
    permissions:
      contents: read
    uses: $/.github/workflows/nix-check.yaml

  required:
    name: CI required
    if: ${{ !cancelled() }}
    needs: [workflow-quality, javascript, nix-quality, renovate-config, prepare-pnpm-deps, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    cache-mode: none
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
