name: Reusable Nix Checks

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.system }} / ${{ matrix.partition }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
        partition: [modules, clients]
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      # Both partitions transitively depend on the client Bun stores
      - uses: $/.github/actions/import-bun-deps

      - name: Build native flake partition
        env:
          PARTITION: ${{ matrix.partition }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: bash .github/scripts/build-flake-partition.sh "$PARTITION" "$EXPECTED_SYSTEM"

      - name: Check generated plugin metadata
        if: matrix.partition == 'clients' && matrix.system == 'x86_64-linux'
        run: |
          set -o errexit -o nounset -o pipefail
          generated=$(nix build \
            --option allow-import-from-derivation false \
            .#generate --no-link --print-out-paths)
          for generated_entry in "$generated"/plugins/*; do
            committed_entry="modules/plugins/$(basename "$generated_entry")"
            if ! diff --recursive --unified -- "$committed_entry" "$generated_entry"; then
              echo "::error file=$committed_entry::Generated plugin metadata is stale"
              exit 1
            fi
          done

      - name: Build client mods against stable Nixpkgs
        if: matrix.partition == 'clients' && matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = builtins.currentSystem;
              };
              packages = import ./pkgs { inherit pkgs; };
            in
            [ packages.equicord packages.vencord ]
          '
