name: Reusable Nix Checks

on:
  workflow_call:

permissions: {}

# Build artifacts cross jobs; mutable Actions caches do not.
cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: $/.github/actions/install-nix

      - uses: $/.github/actions/import-bun-deps

      - name: Verify host and target architectures
        env:
          EXPECTED_HOST_SYSTEM: ${{ matrix.system }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          actual_host_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_host_system" != "$EXPECTED_HOST_SYSTEM" ]]; then
            echo "::error::Expected host $EXPECTED_HOST_SYSTEM, got $actual_host_system"
            exit 1
          fi
          actual_system=$(nix --option system "$EXPECTED_SYSTEM" \
            eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_system" != "$EXPECTED_SYSTEM" ]]; then
            echo "::error::Expected target $EXPECTED_SYSTEM, got $actual_system"
            exit 1
          fi

      - name: Check generated plugin metadata
        if: matrix.system == 'x86_64-linux'
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -o errexit -o nounset -o pipefail
          generated=$(nix --option system "$EXPECTED_SYSTEM" build \
            --option allow-import-from-derivation false \
            .#generate --no-link --print-out-paths)
          for generated_entry in "$generated"/plugins/*; do
            committed_entry="modules/plugins/$(basename "$generated_entry")"
            if ! diff --recursive --unified -- "$committed_entry" "$generated_entry"; then
              echo "::error file=$committed_entry::Generated plugin metadata is stale"
              exit 1
            fi
          done

      - name: Run flake checks
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          nix_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nix_args+=(--max-jobs 1 --cores 2)
          fi
          nix --option system "$EXPECTED_SYSTEM" flake check \
            --option allow-import-from-derivation false \
            "${nix_args[@]}" --print-build-logs

      - name: Build every package
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          set -o errexit -o nounset -o pipefail
          available=$(nix --option system "$EXPECTED_SYSTEM" eval \
            --option allow-import-from-derivation false \
            --raw ".#packages.$EXPECTED_SYSTEM" \
            --apply 'packages: builtins.concatStringsSep " " (map (name: ".#" + name) (builtins.attrNames packages))')
          read -r -a installables <<< "$available"
          nix_args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            nix_args+=(--max-jobs 1 --cores 2)
          fi
          nix --option system "$EXPECTED_SYSTEM" build \
            --option allow-import-from-derivation false \
            "${nix_args[@]}" --no-link --print-build-logs "${installables[@]}"
